name: Build OPPW4 Proton 11 mixer DXVA trace v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opppw4-p11-mixer-dxva-trace-v8.yml'

permissions:
  contents: read

jobs:
  build-arm64ec-sdk35:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout OPPW4FIX
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install host build dependencies
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip xz-utils zstd file ccache \
            flex bison gettext autoconf automake libtool pkg-config \
            mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 \
            libpng-dev libpng-dev:i386 zlib1g-dev zlib1g-dev:i386

      - name: Clone GE Proton 11 bionic source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch ge-proton11-bionic --recurse-submodules --shallow-submodules \
            https://github.com/The412Banner/proton-wine.git "$GITHUB_WORKSPACE/proton-src"
          cd "$GITHUB_WORKSPACE/proton-src"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/p11-source-commit.txt"

      - name: Apply mixer DXVA trace v8
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'tools/apply-v8-mixer-dxva-trace.py'
          s = p.read_text()
          old = 'trace = find_or_die(s, "    TRACE(", pos, "CreateVideoProcessor TRACE")'
          new = 'trace = find_or_die(s, "    FIXME(", pos, "CreateVideoProcessor FIXME")'
          if old not in s:
              raise SystemExit('CreateVideoProcessor patcher anchor correction not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 "$GITHUB_WORKSPACE/tools/apply-v8-mixer-dxva-trace.py"
          grep -n -m1 'OPPW4TRACE MIXER_INPUT' dlls/evr/mixer.c
          grep -n -m1 'OPPW4TRACE MIXER_RENDER' dlls/evr/mixer.c
          grep -n -m1 'OPPW4TRACE DXVA_CREATE_PROCESSOR' dlls/dxva2/main.c
          grep -n -m1 'OPPW4TRACE DXVA_STRETCH' dlls/dxva2/main.c

      - name: Download Termux ARM64 sysroot
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/termuxfs/aarch64"
          cd "$HOME/termuxfs/aarch64"
          wget -q --show-progress https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Set up Android NDK r27d
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Set up LLVM-MinGW ARM64EC toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          wget -q --show-progress https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen Proton 11
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0-autogen.sh
          test -x ./configure

      - name: Build wine-tools
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0.sh
          test -d wine-tools

      - name: Configure ARM64EC SDK35 / 16KB
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --configure

      - name: Build and install Proton 11 ARM64EC with strict failure capture
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          FULL_LOG="$RUNNER_TEMP/opppw4-v8-build-full.log"
          BUILD_DIAG="$GITHUB_WORKSPACE/v8-build-diagnostics.txt"
          : > "$FULL_LOG"
          : > "$BUILD_DIAG"

          echo 'phase=build' >> "$BUILD_DIAG"
          if ! bash -e build-scripts/build-step-arm64ec.sh --enable-16kb-pages --build >"$FULL_LOG" 2>&1; then
            {
              echo 'RESULT=FAIL build'
              echo '=== last 180 build lines ==='
              tail -n 180 "$FULL_LOG"
            } >> "$BUILD_DIAG"
            cat "$BUILD_DIAG"
            exit 1
          fi
          echo 'RESULT=PASS build' >> "$BUILD_DIAG"

          echo 'phase=install' >> "$BUILD_DIAG"
          if ! bash -e build-scripts/build-step-arm64ec.sh --enable-16kb-pages --install >>"$FULL_LOG" 2>&1; then
            {
              echo 'RESULT=FAIL install'
              echo '=== last 180 build/install lines ==='
              tail -n 180 "$FULL_LOG"
            } >> "$BUILD_DIAG"
            cat "$BUILD_DIAG"
            exit 1
          fi
          echo 'RESULT=PASS install' >> "$BUILD_DIAG"

      - name: Verify and stage real Wine tree
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/termuxfs/aarch64/data/data/com.termux/files/opt/wine"
          PACKAGE_ROOT="$GITHUB_WORKSPACE/package-root"
          DIAG="$GITHUB_WORKSPACE/v8-package-diagnostics.txt"
          : > "$DIAG"
          fail() { echo "RESULT=FAIL $*" | tee -a "$DIAG"; exit 1; }

          echo 'phase=install-tree' | tee -a "$DIAG"
          du -sh "$INSTALL_DIR" | tee -a "$DIAG"
          [ -d "$INSTALL_DIR/bin" ] || fail 'missing bin'
          [ -d "$INSTALL_DIR/lib/wine" ] || fail 'missing lib/wine'
          [ -d "$INSTALL_DIR/share/wine" ] || fail 'missing share/wine'
          INSTALL_FILES="$(find "$INSTALL_DIR/lib/wine" -type f | wc -l)"
          INSTALL_BYTES="$(du -sb "$INSTALL_DIR/lib/wine" | cut -f1)"
          echo "install_files=$INSTALL_FILES" | tee -a "$DIAG"
          echo "install_bytes=$INSTALL_BYTES" | tee -a "$DIAG"
          [ "$INSTALL_FILES" -ge 100 ] || fail "only $INSTALL_FILES files"
          [ "$INSTALL_BYTES" -ge 50000000 ] || fail "only $INSTALL_BYTES bytes"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT" "$GITHUB_WORKSPACE/out"
          cp -a "$INSTALL_DIR/bin" "$PACKAGE_ROOT/"
          cp -a "$INSTALL_DIR/lib" "$PACKAGE_ROOT/"
          cp -a "$INSTALL_DIR/share" "$PACKAGE_ROOT/"
          echo 'RESULT=PASS install-and-stage' | tee -a "$DIAG"

      - name: Verify v8 trace markers in packaged runtime
        run: |
          set -euo pipefail
          DIAG="$GITHUB_WORKSPACE/v8-package-diagnostics.txt"
          python3 - <<'PY' 2>&1 | tee -a "$DIAG"
          import os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'package-root/lib/wine'
          markers = {
              b'OPPW4TRACE MIXER_INPUT': None,
              b'OPPW4TRACE MIXER_RENDER': None,
              b'OPPW4TRACE DXVA_CREATE_PROCESSOR': None,
              b'OPPW4TRACE DXVA_BLT': None,
              b'OPPW4TRACE DXVA_STRETCH': None,
          }
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              for marker in markers:
                  if markers[marker] is None and marker in data:
                      markers[marker] = path
              if all(markers.values()):
                  break
          for marker, path in markers.items():
              print(f'{marker.decode()}={path}')
          missing = [m.decode() for m, p in markers.items() if p is None]
          if missing:
              raise SystemExit('missing trace markers: ' + ', '.join(missing))
          print('RESULT=PASS trace-markers')
          PY

      - name: Upload compact v8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-p11-mixer-dxva-trace-v8-diagnostics
          path: |
            v8-build-diagnostics.txt
            v8-package-diagnostics.txt
            p11-source-commit.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Download Proton 11 ARM64EC prefix pack
        run: |
          set -euxo pipefail
          wget -q --show-progress \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O "$GITHUB_WORKSPACE/prefixPack.txz"

      - name: Package verified Bannerlator v8 WCP
        run: |
          set -euxo pipefail
          PACKAGE_ROOT="$GITHUB_WORKSPACE/package-root"
          WCP="$GITHUB_WORKSPACE/out/proton-11.0.3.10-arm64ec-opppw4-mixer-dxva-trace-v8-sdk35.wcp"
          cp "$GITHUB_WORKSPACE/prefixPack.txz" "$PACKAGE_ROOT/prefixPack.txz"
          cat > "$PACKAGE_ROOT/profile.json" <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0.3.10-arm64ec",
            "versionCode": 2,
            "description": "OPPW4 TRACE v8: Proton 11 ARM64EC SDK35/16KB. Traces MFVideoMixer9 -> DXVA2 -> D3D9 StretchRect.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          cd "$PACKAGE_ROOT"
          tar -I 'zstd -T0 -15' -cf "$WCP" bin lib share prefixPack.txz profile.json
          sha256sum "$WCP" | tee "$GITHUB_WORKSPACE/out/wcp-sha256.txt"
          ls -lh "$WCP" | tee "$GITHUB_WORKSPACE/out/wcp-size.txt"
          tar -I zstd -tf "$WCP" | wc -l | tee "$GITHUB_WORKSPACE/out/wcp-entry-count.txt"
          test "$(tar -I zstd -tf "$WCP" | grep -c '^lib/wine/')" -ge 100

      - name: Upload verified OPPW4 P11 mixer DXVA trace v8 Proton
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-p11-mixer-dxva-trace-v8-arm64ec-sdk35
          path: |
            out/proton-11.0.3.10-arm64ec-opppw4-mixer-dxva-trace-v8-sdk35.wcp
            out/wcp-sha256.txt
            out/wcp-size.txt
            out/wcp-entry-count.txt
            p11-source-commit.txt
            v8-build-diagnostics.txt
            v8-package-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
