name: Build OPPW4 Proton 11 media source sample trace v6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opppw4-p11-media-source-trace-v6.yml'

permissions:
  contents: read

jobs:
  build-arm64ec-sdk35:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install host build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip xz-utils zstd file ccache \
            flex bison gettext autoconf automake libtool pkg-config \
            mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 \
            libpng-dev libpng-dev:i386 zlib1g-dev zlib1g-dev:i386

      - name: Clone GE Proton 11 bionic source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch ge-proton11-bionic --recurse-submodules --shallow-submodules \
            https://github.com/The412Banner/proton-wine.git "$GITHUB_WORKSPACE/proton-src"
          cd "$GITHUB_WORKSPACE/proton-src"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/p11-source-commit.txt"

      - name: Instrument WineGStreamer media source sample path
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('dlls/winegstreamer/media_source.c')
          s = p.read_text()

          # Media source Start: prove that the resolved source is actually started.
          sig = '''static HRESULT WINAPI media_source_Start(IMFMediaSource *iface, IMFPresentationDescriptor *descriptor,\n                                     const GUID *time_format, const PROPVARIANT *position)\n{'''
          pos = s.find(sig)
          if pos < 0:
              raise SystemExit('media_source_Start signature not found')
          needle = '    HRESULT hr;\n'
          n = s.find(needle, pos)
          if n < 0:
              raise SystemExit('media_source_Start declaration anchor not found')
          insert = '''    static unsigned int oppw4_source_start_count;\n    unsigned int oppw4_start_idx = ++oppw4_source_start_count;\n    if (oppw4_start_idx <= 20)\n        ERR("OPPW4TRACE WG_SOURCE_START #%u source=%p state=%u descriptor=%p format=%s pos_vt=%u.\\n",\n                oppw4_start_idx, source, source->state, descriptor, debugstr_guid(time_format), position ? position->vt : 0xffff);\n'''
          s = s[:n+len(needle)] + insert + s[n+len(needle):]

          # Stream creation: map stream id to the media type selected by WineGStreamer.
          sig = '''static HRESULT media_stream_create(IMFMediaSource *source, IMFStreamDescriptor *descriptor,\n        wg_parser_stream_t wg_stream, struct media_stream **out)\n{'''
          pos = s.find(sig)
          if pos < 0:
              raise SystemExit('media_stream_create signature not found')
          needle = '    HRESULT hr;\n'
          n = s.find(needle, pos)
          if n < 0:
              raise SystemExit('media_stream_create declaration anchor not found')
          insert = '''    IMFMediaType *oppw4_type = NULL;\n    GUID oppw4_major = {0}, oppw4_subtype = {0};\n    DWORD oppw4_stream_id = ~0u;\n'''
          s = s[:n+len(needle)] + insert + s[n+len(needle):]
          old = '''    object->wg_stream = wg_stream;\n\n    TRACE("Created stream object %p.\\n", object);'''
          new = '''    object->wg_stream = wg_stream;\n\n    IMFStreamDescriptor_GetStreamIdentifier(descriptor, &oppw4_stream_id);\n    if (SUCCEEDED(stream_descriptor_get_media_type(descriptor, &oppw4_type)))\n    {\n        IMFMediaType_GetGUID(oppw4_type, &MF_MT_MAJOR_TYPE, &oppw4_major);\n        IMFMediaType_GetGUID(oppw4_type, &MF_MT_SUBTYPE, &oppw4_subtype);\n        IMFMediaType_Release(oppw4_type);\n    }\n    ERR("OPPW4TRACE WG_STREAM_CREATE id=%lu stream=%p wg=%#I64x major=%s subtype=%s.\\n",\n            oppw4_stream_id, object, wg_stream, debugstr_guid(&oppw4_major), debugstr_guid(&oppw4_subtype));\n\n    TRACE("Created stream object %p.\\n", object);'''
          if old not in s:
              raise SystemExit('media_stream_create body anchor not found')
          s = s.replace(old, new, 1)

          # Every consumer request for a sample. If video requests never arrive,
          # the break is above WineGStreamer decoding/sample delivery.
          sig = '''static HRESULT WINAPI media_stream_RequestSample(IMFMediaStream *iface, IUnknown *token)\n{'''
          pos = s.find(sig)
          if pos < 0:
              raise SystemExit('RequestSample signature not found')
          needle = '    HRESULT hr;\n'
          n = s.find(needle, pos)
          if n < 0:
              raise SystemExit('RequestSample declaration anchor not found')
          insert = '''    static unsigned int oppw4_request_count;\n    unsigned int oppw4_request_idx = ++oppw4_request_count;\n    if (oppw4_request_idx <= 160)\n        ERR("OPPW4TRACE WG_REQUEST #%u stream_id=%lu stream=%p source_state=%u active=%u eos=%u token=%p.\\n",\n                oppw4_request_idx, stream->stream_id, stream, source->state, stream->active, stream->eos, token);\n'''
          s = s[:n+len(needle)] + insert + s[n+len(needle):]

          # Real bytes copied from the wg parser into an MF sample.
          sig = '''static HRESULT media_stream_send_sample(struct media_stream *stream, const struct wg_parser_buffer *wg_buffer, IUnknown *token)\n{'''
          pos = s.find(sig)
          if pos < 0:
              raise SystemExit('media_stream_send_sample signature not found')
          needle = '    BYTE *data;\n'
          n = s.find(needle, pos)
          if n < 0:
              raise SystemExit('send_sample declaration anchor not found')
          insert = '''    static unsigned int oppw4_send_count;\n    unsigned int oppw4_send_idx = ++oppw4_send_count;\n    unsigned int oppw4_hash = 0, oppw4_nz = 0, oppw4_i, oppw4_inspect;\n'''
          s = s[:n+len(needle)] + insert + s[n+len(needle):]
          old = '''    wg_parser_stream_release_buffer(stream->wg_stream);\n\n    if (FAILED(hr = IMFMediaBuffer_Unlock(buffer)))'''
          new = '''    wg_parser_stream_release_buffer(stream->wg_stream);\n\n    oppw4_inspect = wg_buffer->size > 65536 ? 65536 : wg_buffer->size;\n    for (oppw4_i = 0; oppw4_i < oppw4_inspect; oppw4_i += 67)\n    {\n        oppw4_hash = (oppw4_hash * 33u) ^ data[oppw4_i];\n        if (data[oppw4_i]) ++oppw4_nz;\n    }\n    if (oppw4_send_idx <= 160)\n        ERR("OPPW4TRACE WG_SAMPLE_BYTES #%u stream_id=%lu size=%u inspect=%u hash=%08x nz=%u pts=%I64d dur=%I64d.\\n",\n                oppw4_send_idx, stream->stream_id, wg_buffer->size, oppw4_inspect, oppw4_hash, oppw4_nz,\n                wg_buffer->pts, wg_buffer->duration);\n\n    if (FAILED(hr = IMFMediaBuffer_Unlock(buffer)))'''
          if old not in s:
              raise SystemExit('send_sample copy anchor not found')
          s = s.replace(old, new, 1)

          old = '''    hr = IMFMediaEventQueue_QueueEventParamUnk(stream->event_queue, MEMediaSample,\n            &GUID_NULL, S_OK, (IUnknown *)sample);'''
          new = '''    hr = IMFMediaEventQueue_QueueEventParamUnk(stream->event_queue, MEMediaSample,\n            &GUID_NULL, S_OK, (IUnknown *)sample);\n    if (oppw4_send_idx <= 160)\n        ERR("OPPW4TRACE WG_SAMPLE_QUEUE #%u stream_id=%lu hr=%#lx sample=%p.\\n",\n                oppw4_send_idx, stream->stream_id, hr, sample);'''
          if old not in s:
              raise SystemExit('sample queue anchor not found')
          s = s.replace(old, new, 1)

          # EOS is critical: it distinguishes "no buffer" from "sample delivered".
          sig = '''static HRESULT media_stream_send_eos(struct media_source *source, struct media_stream *stream)\n{'''
          pos = s.find(sig)
          if pos < 0:
              raise SystemExit('send_eos signature not found')
          needle = '    HRESULT hr;\n'
          n = s.find(needle, pos)
          if n < 0:
              raise SystemExit('send_eos declaration anchor not found')
          insert = '''    static unsigned int oppw4_eos_count;\n    unsigned int oppw4_eos_idx = ++oppw4_eos_count;\n    if (oppw4_eos_idx <= 40)\n        ERR("OPPW4TRACE WG_EOS #%u stream_id=%lu state=%u.\\n", oppw4_eos_idx, stream->stream_id, source->state);\n'''
          s = s[:n+len(needle)] + insert + s[n+len(needle):]

          p.write_text(s)
          PY

          {
            grep -n -A8 -B4 'OPPW4TRACE WG_SOURCE_START' dlls/winegstreamer/media_source.c
            grep -n -A10 -B5 'OPPW4TRACE WG_STREAM_CREATE' dlls/winegstreamer/media_source.c
            grep -n -A8 -B4 'OPPW4TRACE WG_REQUEST' dlls/winegstreamer/media_source.c
            grep -n -A12 -B6 'OPPW4TRACE WG_SAMPLE_BYTES' dlls/winegstreamer/media_source.c
            grep -n -A6 -B4 'OPPW4TRACE WG_EOS' dlls/winegstreamer/media_source.c
          } | tee "$GITHUB_WORKSPACE/media-source-trace-v6-patch.txt"

      - name: Download Termux ARM64 sysroot
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/termuxfs/aarch64"
          cd "$HOME/termuxfs/aarch64"
          wget -q --show-progress https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Set up Android NDK r27d
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Set up LLVM-MinGW ARM64EC toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          wget -q --show-progress https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen Proton 11
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0-autogen.sh
          test -x ./configure

      - name: Build wine-tools
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0.sh
          test -d wine-tools

      - name: Configure ARM64EC SDK35 / 16KB
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --configure

      - name: Build and install Proton 11 ARM64EC
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --build
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --install

      - name: Verify WineGStreamer trace payload exists
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$OUTPUT_DIR" -type f \( -iname 'winegstreamer*' -o -iname 'mfplat*' \) -print | sort | tee "$GITHUB_WORKSPACE/out/media-files.txt"
          test "$(find "$OUTPUT_DIR" -type f -iname 'winegstreamer*' | wc -l)" -gt 0
          find "$OUTPUT_DIR" -type f -iname 'winegstreamer*' -exec sha256sum {} \; | tee "$GITHUB_WORKSPACE/out/media-sha256.txt"

      - name: Download Proton 11 ARM64EC prefix pack
        run: |
          set -euxo pipefail
          wget -q --show-progress \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O "$GITHUB_WORKSPACE/prefixPack.txz"

      - name: Package Bannerlator media source trace WCP
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          cd "$OUTPUT_DIR"
          cp "$GITHUB_WORKSPACE/prefixPack.txz" .
          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0.3.7-arm64ec",
            "versionCode": 2,
            "description": "OPPW4 media-source TRACE v6: Proton 11 ARM64EC SDK35/16KB. Traces WineGStreamer source start, stream identities, RequestSample, real sample bytes/queue and EOS via OPPW4TRACE.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          tar -I 'zstd -T0 -15' -cf "$GITHUB_WORKSPACE/out/proton-11.0.3.7-arm64ec-opppw4-media-source-trace-v6-sdk35.wcp" \
            bin lib share prefixPack.txz profile.json
          sha256sum "$GITHUB_WORKSPACE/out/proton-11.0.3.7-arm64ec-opppw4-media-source-trace-v6-sdk35.wcp" | tee "$GITHUB_WORKSPACE/out/wcp-sha256.txt"
          ls -lh "$GITHUB_WORKSPACE/out/proton-11.0.3.7-arm64ec-opppw4-media-source-trace-v6-sdk35.wcp"

      - name: Upload OPPW4 P11 media source trace v6 Proton
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-p11-media-source-trace-v6-arm64ec-sdk35
          path: |
            out/proton-11.0.3.7-arm64ec-opppw4-media-source-trace-v6-sdk35.wcp
            out/wcp-sha256.txt
            out/media-files.txt
            out/media-sha256.txt
            p11-source-commit.txt
            media-source-trace-v6-patch.txt
          if-no-files-found: error
          retention-days: 14
