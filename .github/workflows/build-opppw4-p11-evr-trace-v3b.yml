name: Build OPPW4 Proton 11 EVR input trace v3b

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opppw4-p11-evr-trace-v3b.yml'

permissions:
  contents: read

jobs:
  build-arm64ec-sdk35:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install host build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip xz-utils zstd file ccache \
            flex bison gettext autoconf automake libtool pkg-config \
            mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 \
            libpng-dev libpng-dev:i386 zlib1g-dev zlib1g-dev:i386

      - name: Clone GE Proton 11 bionic source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch ge-proton11-bionic --recurse-submodules --shallow-submodules \
            https://github.com/The412Banner/proton-wine.git "$GITHUB_WORKSPACE/proton-src"
          cd "$GITHUB_WORKSPACE/proton-src"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/p11-source-commit.txt"

      - name: Instrument actual Wine EVR input samples
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dlls/evr/evr.c')
          s = p.read_text()

          old = '    IMFSample *sample;\n\n    if (!filter->media_type)'
          new = '    IMFSample *sample;\n    static unsigned int oppw4_trace_count;\n    unsigned int oppw4_trace_idx;\n\n    if (!filter->media_type)'
          if old not in s:
              raise SystemExit('render declaration anchor not found')
          s = s.replace(old, new, 1)

          old = '    IMFMediaType_GetGUID(filter->media_type, &MF_MT_SUBTYPE, &subtype);\n\n    if (IsEqualGUID(&subtype, &MFVideoFormat_ARGB32)'
          new = '''    IMFMediaType_GetGUID(filter->media_type, &MF_MT_SUBTYPE, &subtype);\n    oppw4_trace_idx = ++oppw4_trace_count;\n    if (oppw4_trace_idx <= 50)\n    {\n        BYTE *oppw4_src = NULL;\n        LONG oppw4_len = IMediaSample_GetActualDataLength(input_sample);\n        LONG oppw4_size = IMediaSample_GetSize(input_sample);\n        HRESULT oppw4_ptr_hr = IMediaSample_GetPointer(input_sample, &oppw4_src);\n        unsigned int oppw4_sum = 0, oppw4_nonzero = 0, oppw4_i, oppw4_inspect = 0;\n        if (SUCCEEDED(oppw4_ptr_hr) && oppw4_src && oppw4_len > 0)\n        {\n            oppw4_inspect = oppw4_len > 16384 ? 16384 : (unsigned int)oppw4_len;\n            for (oppw4_i = 0; oppw4_i < oppw4_inspect; oppw4_i += 17)\n            {\n                oppw4_sum = (oppw4_sum * 33u) ^ oppw4_src[oppw4_i];\n                if (oppw4_src[oppw4_i]) ++oppw4_nonzero;\n            }\n        }\n        ERR("OPPW4TRACE INPUT #%u subtype=%s actual=%ld size=%ld ptrhr=%#lx inspect=%u sum=%08x nz=%u first=%02x,%02x,%02x,%02x.\\n",\n                oppw4_trace_idx, debugstr_guid(&subtype), oppw4_len, oppw4_size, oppw4_ptr_hr,\n                oppw4_inspect, oppw4_sum, oppw4_nonzero,\n                oppw4_src && oppw4_len > 0 ? oppw4_src[0] : 0,\n                oppw4_src && oppw4_len > 1 ? oppw4_src[1] : 0,\n                oppw4_src && oppw4_len > 2 ? oppw4_src[2] : 0,\n                oppw4_src && oppw4_len > 3 ? oppw4_src[3] : 0);\n    }\n\n    if (IsEqualGUID(&subtype, &MFVideoFormat_ARGB32)'''
          if old not in s:
              raise SystemExit('subtype anchor not found')
          s = s.replace(old, new, 1)

          old = '''        if (SUCCEEDED(hr = evr_copy_sample_buffer(filter, &subtype, input_sample, &sample)))\n        {\n            if (SUCCEEDED(IMFTransform_ProcessInput(filter->mixer, 0, sample, 0)))\n                IMFVideoPresenter_ProcessMessage(filter->presenter, MFVP_MESSAGE_PROCESSINPUTNOTIFY, 0);\n\n            IMFSample_Release(sample);\n        }'''
          new = '''        if (SUCCEEDED(hr = evr_copy_sample_buffer(filter, &subtype, input_sample, &sample)))\n        {\n            HRESULT oppw4_mixer_hr = IMFTransform_ProcessInput(filter->mixer, 0, sample, 0);\n            HRESULT oppw4_present_hr = E_NOTIMPL;\n            if (SUCCEEDED(oppw4_mixer_hr))\n                oppw4_present_hr = IMFVideoPresenter_ProcessMessage(filter->presenter, MFVP_MESSAGE_PROCESSINPUTNOTIFY, 0);\n            if (oppw4_trace_idx <= 50)\n                ERR("OPPW4TRACE PIPE #%u copy=%#lx mixer=%#lx presenter=%#lx.\\n",\n                        oppw4_trace_idx, hr, oppw4_mixer_hr, oppw4_present_hr);\n\n            IMFSample_Release(sample);\n        }\n        else if (oppw4_trace_idx <= 50)\n            ERR("OPPW4TRACE COPY_FAIL #%u hr=%#lx subtype=%s.\\n", oppw4_trace_idx, hr, debugstr_guid(&subtype));'''
          if old not in s:
              raise SystemExit('pipeline anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          grep -n -A28 -B5 'OPPW4TRACE INPUT' dlls/evr/evr.c | tee "$GITHUB_WORKSPACE/evr-trace-patch.txt"
          grep -n -A12 -B5 'OPPW4TRACE PIPE' dlls/evr/evr.c | tee -a "$GITHUB_WORKSPACE/evr-trace-patch.txt"
          grep -q 'OPPW4TRACE COPY_FAIL' dlls/evr/evr.c

      - name: Download Termux ARM64 sysroot
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/termuxfs/aarch64"
          cd "$HOME/termuxfs/aarch64"
          wget -q --show-progress https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Set up Android NDK r27d
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Set up LLVM-MinGW ARM64EC toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          wget -q --show-progress https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen Proton 11
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0-autogen.sh
          test -x ./configure

      - name: Build wine-tools
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0.sh
          test -d wine-tools

      - name: Configure ARM64EC SDK35 / 16KB
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --configure

      - name: Build and install Proton 11 ARM64EC
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --build
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --install

      - name: Verify EVR payload exists
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$OUTPUT_DIR" -type f -iname 'evr*' -print | sort | tee "$GITHUB_WORKSPACE/out/evr-files.txt"
          test "$(find "$OUTPUT_DIR" -type f -iname 'evr*' | wc -l)" -gt 0
          find "$OUTPUT_DIR" -type f -iname 'evr*' -exec sha256sum {} \; | tee "$GITHUB_WORKSPACE/out/evr-sha256.txt"

      - name: Download Proton 11 ARM64EC prefix pack
        run: |
          set -euxo pipefail
          wget -q --show-progress \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O "$GITHUB_WORKSPACE/prefixPack.txz"

      - name: Package Bannerlator EVR trace WCP
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          cd "$OUTPUT_DIR"
          cp "$GITHUB_WORKSPACE/prefixPack.txz" .
          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0.3.4-arm64ec",
            "versionCode": 3,
            "description": "OPPW4 EVR TRACE v3b: Proton 11 ARM64EC SDK35/16KB. Emits OPPW4TRACE INPUT/PIPE records for the game's actual EVR samples into wine_debug.log.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          tar -I 'zstd -T0 -15' -cf "$GITHUB_WORKSPACE/out/proton-11.0.3.4-arm64ec-opppw4-evr-trace-sdk35.wcp" \
            bin lib share prefixPack.txz profile.json
          sha256sum "$GITHUB_WORKSPACE/out/proton-11.0.3.4-arm64ec-opppw4-evr-trace-sdk35.wcp" \
            | tee "$GITHUB_WORKSPACE/out/wcp-sha256.txt"
          ls -lh "$GITHUB_WORKSPACE/out/proton-11.0.3.4-arm64ec-opppw4-evr-trace-sdk35.wcp"

      - name: Upload OPPW4 P11 EVR trace Proton
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-p11-evr-trace-v3b-arm64ec-sdk35
          path: |
            out/proton-11.0.3.4-arm64ec-opppw4-evr-trace-sdk35.wcp
            out/wcp-sha256.txt
            out/evr-files.txt
            out/evr-sha256.txt
            p11-source-commit.txt
            evr-trace-patch.txt
          if-no-files-found: error
          retention-days: 14
