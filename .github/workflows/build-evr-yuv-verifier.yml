name: Build OPPW4 EVR YUV StretchRect verifier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/d3d9_evr_yuv_stretch_test.cpp'
      - '.github/workflows/build-evr-yuv-verifier.yml'

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build verifier
        shell: cmd
        run: |
          if not exist out mkdir out
          cl /nologo /std:c++17 /EHsc /O2 /W4 tests\d3d9_evr_yuv_stretch_test.cpp /Fe:out\opppw4-evr-yuv-stretch-test-x64.exe /link d3d9.lib user32.lib

      - name: Upload verifier
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-evr-yuv-stretch-verifier-x64
          path: out/opppw4-evr-yuv-stretch-test-x64.exe
          if-no-files-found: error
          retention-days: 14
