name: Build OPPW4 sharedgpures Proton

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opppw4-sharedgpures-proton.yml'

permissions:
  contents: read

jobs:
  build-arm64ec-sdk35:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install host build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip xz-utils zstd file \
            flex bison gettext autoconf automake libtool pkg-config \
            mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 \
            libpng-dev libpng-dev:i386 zlib1g-dev zlib1g-dev:i386

      - name: Clone Bannerlator Proton 10 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch proton_10.0 --recurse-submodules --shallow-submodules \
            https://github.com/The412Banner/proton-wine.git "$GITHUB_WORKSPACE/proton-src"
          cd "$GITHUB_WORKSPACE/proton-src"
          git submodule status --recursive
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/build-source.txt"

      - name: Apply sharedgpures patches
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          git fetch --no-tags https://github.com/The412Banner/proton-wine.git \
            refs/pull/312/head:refs/remotes/origin/pr312 \
            refs/pull/313/head:refs/remotes/origin/pr313
          git cherry-pick refs/remotes/origin/pr312
          git cherry-pick refs/remotes/origin/pr313
          git log -3 --oneline | tee "$GITHUB_WORKSPACE/patched-source.txt"

      - name: Download Termux ARM64 sysroot
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/termuxfs/aarch64"
          cd "$HOME/termuxfs/aarch64"
          wget -q --show-progress https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Set up Android NDK r27d
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Set up LLVM-MinGW ARM64EC toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          wget -q --show-progress https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen Proton 10
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0-autogen.sh
          test -x ./configure

      - name: Build wine-tools
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0.sh
          test -d wine-tools

      - name: Configure ARM64EC SDK35 / 16KB
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --configure

      - name: Build and install ARM64EC Proton
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --build
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --install

      - name: Verify sharedgpures payload exists
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$OUTPUT_DIR" -type f \( -iname 'd3dkmt*' -o -iname 'win32u*' -o -iname 'ntdll*' \) -print | sort \
            | tee "$GITHUB_WORKSPACE/out/sharedgpures-files.txt"
          test "$(find "$OUTPUT_DIR" -type f \( -iname 'd3dkmt*' -o -iname 'win32u*' -o -iname 'ntdll*' \) | wc -l)" -gt 0
          find "$OUTPUT_DIR" -type f \( -iname 'd3dkmt*' -o -iname 'win32u*' -o -iname 'ntdll*' \) -exec sha256sum {} \; \
            | tee "$GITHUB_WORKSPACE/out/sharedgpures-sha256.txt"

      - name: Download Proton 10 ARM64EC prefix pack
        run: |
          set -euxo pipefail
          wget -q --show-progress \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-10.txz \
            -O "$GITHUB_WORKSPACE/prefixPack.txz"

      - name: Package Bannerlator WCP
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$HOME/compiled-files-aarch64"
          cd "$OUTPUT_DIR"
          cp "$GITHUB_WORKSPACE/prefixPack.txz" .
          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "10.0.3.2-arm64ec",
            "versionCode": 4,
            "description": "OPPW4 sharedgpures diagnostic build: Proton 10 ARM64EC SDK35/16KB with The412Banner PR312+PR313 shared GPU-resource patches.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          tar -I 'zstd -T0 -15' -cf "$GITHUB_WORKSPACE/out/proton-10.0.3.2-arm64ec-sharedgpures-sdk35.wcp" \
            bin lib share prefixPack.txz profile.json
          sha256sum "$GITHUB_WORKSPACE/out/proton-10.0.3.2-arm64ec-sharedgpures-sdk35.wcp" \
            | tee "$GITHUB_WORKSPACE/out/wcp-sha256.txt"
          ls -lh "$GITHUB_WORKSPACE/out/proton-10.0.3.2-arm64ec-sharedgpures-sdk35.wcp"

      - name: Upload sharedgpures Proton WCP
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-sharedgpures-proton-arm64ec-sdk35
          path: |
            out/proton-10.0.3.2-arm64ec-sharedgpures-sdk35.wcp
            out/wcp-sha256.txt
            out/sharedgpures-files.txt
            out/sharedgpures-sha256.txt
            build-source.txt
            patched-source.txt
          if-no-files-found: error
          retention-days: 14
