name: Build OPPW4 DXVA2 EVR verifier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/dxva2_evr_processor_test.cpp'
      - '.github/workflows/build-dxva2-evr-verifier.yml'

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build verifier
        shell: cmd
        run: |
          if not exist out mkdir out
          cl /nologo /std:c++17 /EHsc /O2 /W4 tests\dxva2_evr_processor_test.cpp /Fe:out\opppw4-dxva2-evr-processor-test-x64.exe /link d3d9.lib dxva2.lib user32.lib ole32.lib

      - name: Upload verifier
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-dxva2-evr-verifier-x64
          path: out/opppw4-dxva2-evr-processor-test-x64.exe
          if-no-files-found: error
          retention-days: 14
