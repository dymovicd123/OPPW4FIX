name: Build OPPW4 Proton 11 mixer DXVA trace v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opppw4-p11-session-evr-trace-v7-fixed.yml'

permissions:
  contents: read

jobs:
  build-arm64ec-sdk35:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout OPPW4FIX
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install host build dependencies
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip xz-utils zstd file ccache \
            flex bison gettext autoconf automake libtool pkg-config \
            mingw-w64 gcc-multilib g++-multilib \
            libfreetype6-dev libfreetype6-dev:i386 \
            libpng-dev libpng-dev:i386 zlib1g-dev zlib1g-dev:i386

      - name: Clone GE Proton 11 bionic source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch ge-proton11-bionic --recurse-submodules --shallow-submodules \
            https://github.com/The412Banner/proton-wine.git "$GITHUB_WORKSPACE/proton-src"
          cd "$GITHUB_WORKSPACE/proton-src"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/p11-source-commit.txt"

      - name: Reuse and apply the exact v7 MF session EVR instrumentation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE'])
          workflow = root / '.github/workflows/build-opppw4-p11-session-evr-trace-v7.yml'
          text = workflow.read_text()
          begin = "          python3 - <<'PY'\n"
          start = text.find(begin)
          if start < 0:
              raise SystemExit('v7 instrumentation heredoc start not found')
          start += len(begin)
          end = text.find('\n          PY\n', start)
          if end < 0:
              raise SystemExit('v7 instrumentation heredoc end not found')
          script = textwrap.dedent(text[start:end])

          old = '        MFGetAttributeSize((IMFAttributes *)type, &MF_MT_FRAME_SIZE, &oppw4_w, &oppw4_h);'
          new = '''        {
              UINT64 oppw4_frame_size = 0;
              if (SUCCEEDED(IMFMediaType_GetUINT64(type, &MF_MT_FRAME_SIZE, &oppw4_frame_size)))
              {
                  oppw4_w = (UINT32)(oppw4_frame_size >> 32);
                  oppw4_h = (UINT32)oppw4_frame_size;
              }
          }'''
          if old not in script:
              raise SystemExit('v7 MFGetAttributeSize trace line not found')
          script = script.replace(old, new, 1)

          out = root / 'apply-v7-instrumentation.py'
          out.write_text(script)
          print(f'extracted and corrected {len(script)} bytes of v7 instrumentation to {out}')
          PY

          cd "$GITHUB_WORKSPACE/proton-src"
          python3 "$GITHUB_WORKSPACE/apply-v7-instrumentation.py"
          grep -n -m1 'OPPW4TRACE SESSION_ROUTE' dlls/mf/session.c
          grep -n -m1 'OPPW4TRACE MF_EVR_SAMPLE' dlls/mf/evr.c

      - name: Instrument confirmed MFVideoMixer9 and DXVA2 path
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          python3 - <<'PY'
          from pathlib import Path

          def find_or_die(text, needle, start=0, label=None):
              pos = text.find(needle, start)
              if pos < 0:
                  raise SystemExit(f'anchor not found: {label or needle[:80]}')
              return pos

          def inject_before_trace(text, signature, code):
              pos = find_or_die(text, signature, label=signature)
              trace = find_or_die(text, '    TRACE(', pos, 'TRACE after ' + signature)
              return text[:trace] + code + text[trace:]

          def inject_before_return_after(text, signature, code):
              pos = find_or_die(text, signature, label=signature)
              anchor = '    LeaveCriticalSection(&mixer->cs);\n\n    return hr;'
              ret = find_or_die(text, anchor, pos, 'return after ' + signature)
              replacement = '    LeaveCriticalSection(&mixer->cs);\n\n' + code + '    return hr;'
              return text[:ret] + replacement + text[ret + len(anchor):]

          # The test log reached DXVA2 CreateVideoProcessor but none of the mf/session.c
          # or mf/evr.c markers. Trace the component that actually owns MFVideoMixer9.
          p = Path('dlls/evr/mixer.c')
          s = p.read_text()

          sig = 'static HRESULT WINAPI video_mixer_transform_SetInputType(IMFTransform *iface, DWORD id, IMFMediaType *media_type, DWORD flags)\n{'
          s = inject_before_trace(s, sig, '''    {
              GUID oppw4_subtype = GUID_NULL;
              UINT64 oppw4_size = 0;
              UINT32 oppw4_w = 0, oppw4_h = 0;
              if (media_type)
              {
                  IMFMediaType_GetGUID(media_type, &MF_MT_SUBTYPE, &oppw4_subtype);
                  if (SUCCEEDED(IMFMediaType_GetUINT64(media_type, &MF_MT_FRAME_SIZE, &oppw4_size)))
                  {
                      oppw4_w = (UINT32)(oppw4_size >> 32);
                      oppw4_h = (UINT32)oppw4_size;
                  }
              }
              ERR("OPPW4TRACE MIXER_SET_INPUT mixer=%p id=%lu type=%p subtype=%s size=%ux%u flags=%#lx.\\n",
                      mixer, id, media_type, debugstr_guid(&oppw4_subtype), oppw4_w, oppw4_h, flags);
          }
''')

          sig = 'static HRESULT WINAPI video_mixer_transform_SetOutputType(IMFTransform *iface, DWORD id, IMFMediaType *type, DWORD flags)\n{'
          s = inject_before_trace(s, sig, '''    {
              GUID oppw4_subtype = GUID_NULL;
              UINT64 oppw4_size = 0;
              UINT32 oppw4_w = 0, oppw4_h = 0;
              if (type)
              {
                  IMFMediaType_GetGUID(type, &MF_MT_SUBTYPE, &oppw4_subtype);
                  if (SUCCEEDED(IMFMediaType_GetUINT64(type, &MF_MT_FRAME_SIZE, &oppw4_size)))
                  {
                      oppw4_w = (UINT32)(oppw4_size >> 32);
                      oppw4_h = (UINT32)oppw4_size;
                  }
              }
              ERR("OPPW4TRACE MIXER_SET_OUTPUT mixer=%p id=%lu type=%p subtype=%s size=%ux%u flags=%#lx.\\n",
                      mixer, id, type, debugstr_guid(&oppw4_subtype), oppw4_w, oppw4_h, flags);
          }
''')

          sig = 'static HRESULT WINAPI video_mixer_transform_ProcessInput(IMFTransform *iface, DWORD id, IMFSample *sample, DWORD flags)\n{'
          s = inject_before_trace(s, sig, '''    {
              static unsigned int oppw4_input_count;
              unsigned int oppw4_idx = ++oppw4_input_count;
              DWORD oppw4_bytes = 0, oppw4_buffers = 0;
              LONGLONG oppw4_time = -1, oppw4_dur = -1;
              if (sample)
              {
                  IMFSample_GetTotalLength(sample, &oppw4_bytes);
                  IMFSample_GetBufferCount(sample, &oppw4_buffers);
                  IMFSample_GetSampleTime(sample, &oppw4_time);
                  IMFSample_GetSampleDuration(sample, &oppw4_dur);
              }
              if (oppw4_idx <= 120)
                  ERR("OPPW4TRACE MIXER_INPUT #%u mixer=%p id=%lu sample=%p bytes=%lu buffers=%lu time=%I64d dur=%I64d flags=%#lx.\\n",
                          oppw4_idx, mixer, id, sample, oppw4_bytes, oppw4_buffers, oppw4_time, oppw4_dur, flags);
          }
''')
          s = inject_before_return_after(s, sig, '''    {
        static unsigned int oppw4_input_result_count;
        unsigned int oppw4_idx = ++oppw4_input_result_count;
        if (oppw4_idx <= 120)
            ERR("OPPW4TRACE MIXER_INPUT_RESULT #%u mixer=%p id=%lu hr=%#lx.\\n", oppw4_idx, mixer, id, hr);
    }
''')

          sig = 'static HRESULT WINAPI video_mixer_transform_ProcessOutput(IMFTransform *iface, DWORD flags, DWORD count,\n        MFT_OUTPUT_DATA_BUFFER *buffers, DWORD *status)\n{'
          s = inject_before_trace(s, sig, '''    {
              static unsigned int oppw4_output_count;
              unsigned int oppw4_idx = ++oppw4_output_count;
              IMFSample *oppw4_sample = count && buffers ? buffers[0].pSample : NULL;
              DWORD oppw4_bytes = 0, oppw4_buffers = 0;
              if (oppw4_sample)
              {
                  IMFSample_GetTotalLength(oppw4_sample, &oppw4_bytes);
                  IMFSample_GetBufferCount(oppw4_sample, &oppw4_buffers);
              }
              if (oppw4_idx <= 120)
                  ERR("OPPW4TRACE MIXER_OUTPUT #%u mixer=%p flags=%#lx count=%lu sample=%p bytes=%lu buffers=%lu.\\n",
                          oppw4_idx, mixer, flags, count, oppw4_sample, oppw4_bytes, oppw4_buffers);
          }
''')
          s = inject_before_return_after(s, sig, '''    {
        static unsigned int oppw4_output_result_count;
        unsigned int oppw4_idx = ++oppw4_output_result_count;
        if (oppw4_idx <= 120)
            ERR("OPPW4TRACE MIXER_OUTPUT_RESULT #%u mixer=%p hr=%#lx status=%#lx.\\n",
                    oppw4_idx, mixer, hr, status ? *status : 0);
    }
''')

          sig = 'static void video_mixer_render(struct video_mixer *mixer, IDirect3DSurface9 *rt)\n{'
          pos = find_or_die(s, sig, label=sig)
          decl = find_or_die(s, '    unsigned int i;\n', pos, 'video_mixer_render declarations')
          decl_end = decl + len('    unsigned int i;\n')
          s = s[:decl_end] + '''    static unsigned int oppw4_render_count;
    unsigned int oppw4_render_idx = ++oppw4_render_count;
''' + s[decl_end:]

          call = '        if (FAILED(hr = IDirectXVideoProcessor_VideoProcessBlt(mixer->processor, rt, &params, samples,\n                mixer->input_count, NULL)))'
          call_pos = find_or_die(s, call, pos, 'MFVideoMixer9 VideoProcessBlt call')
          render_log = '''        if (oppw4_render_idx <= 120)
        {
            D3DSURFACE_DESC oppw4_rt_desc = {0};
            HRESULT oppw4_rt_hr = IDirect3DSurface9_GetDesc(rt, &oppw4_rt_desc);
            ERR("OPPW4TRACE MIXER_RENDER #%u mixer=%p processor=%p rt=%p rt_desc_hr=%#lx fmt=%#x size=%ux%u inputs=%u target=(%ld,%ld)-(%ld,%ld).\\n",
                    oppw4_render_idx, mixer, mixer->processor, rt, oppw4_rt_hr, (unsigned int)oppw4_rt_desc.Format,
                    oppw4_rt_desc.Width, oppw4_rt_desc.Height, mixer->input_count,
                    params.TargetRect.left, params.TargetRect.top, params.TargetRect.right, params.TargetRect.bottom);
            for (i = 0; i < mixer->input_count; ++i)
            {
                D3DSURFACE_DESC oppw4_src_desc = {0};
                HRESULT oppw4_src_hr = samples[i].SrcSurface ? IDirect3DSurface9_GetDesc(samples[i].SrcSurface, &oppw4_src_desc) : E_POINTER;
                ERR("OPPW4TRACE MIXER_RENDER_SRC #%u i=%u surface=%p desc_hr=%#lx fmt=%#x size=%ux%u src=(%ld,%ld)-(%ld,%ld) dst=(%ld,%ld)-(%ld,%ld) samplefmt=%u.\\n",
                        oppw4_render_idx, i, samples[i].SrcSurface, oppw4_src_hr, (unsigned int)oppw4_src_desc.Format,
                        oppw4_src_desc.Width, oppw4_src_desc.Height,
                        samples[i].SrcRect.left, samples[i].SrcRect.top, samples[i].SrcRect.right, samples[i].SrcRect.bottom,
                        samples[i].DstRect.left, samples[i].DstRect.top, samples[i].DstRect.right, samples[i].DstRect.bottom,
                        samples[i].SampleFormat.SampleFormat);
            }
        }

'''
          s = s[:call_pos] + render_log + s[call_pos:]
          p.write_text(s)

          # Trace the exact DXVA2 implementation reached in the user's log. This will
          # tell us input/output formats, rectangles and the real StretchRect HRESULT.
          p = Path('dlls/dxva2/main.c')
          s = p.read_text()

          sig = 'static HRESULT WINAPI device_manager_processor_service_CreateSurface(IDirectXVideoProcessorService *iface,\n        UINT width, UINT height, UINT backbuffers, D3DFORMAT format, D3DPOOL pool, DWORD usage, DWORD dxvaType,\n        IDirect3DSurface9 **surfaces, HANDLE *shared_handle)\n{'
          s = inject_before_trace(s, sig, '''    ERR("OPPW4TRACE DXVA_CREATE_SURFACE service=%p size=%ux%u backbuffers=%u format=%#x pool=%u usage=%#lx dxvaType=%lu shared=%p.\\n",
            iface, width, height, backbuffers, (unsigned int)format, pool, usage, dxvaType, shared_handle);
''')

          sig = 'static HRESULT WINAPI device_manager_processor_service_CreateVideoProcessor(IDirectXVideoProcessorService *iface,\n        REFGUID device, const DXVA2_VideoDesc *video_desc, D3DFORMAT rt_format, UINT max_substreams,\n        IDirectXVideoProcessor **processor)\n{'
          pos = find_or_die(s, sig, label=sig)
          first_fixme = find_or_die(s, '    FIXME(', pos, 'CreateVideoProcessor FIXME')
          s = s[:first_fixme] + '''    if (video_desc)
        ERR("OPPW4TRACE DXVA_CREATE_PROCESSOR service=%p device=%s input_fmt=%#x size=%ux%u rt_fmt=%#x max_substreams=%u in_freq=%u/%u out_freq=%u/%u.\\n",
                iface, debugstr_guid(device), (unsigned int)video_desc->Format, video_desc->SampleWidth, video_desc->SampleHeight,
                (unsigned int)rt_format, max_substreams, video_desc->InputSampleFreq.Numerator,
                video_desc->InputSampleFreq.Denominator, video_desc->OutputFrameFreq.Numerator,
                video_desc->OutputFrameFreq.Denominator);

''' + s[first_fixme:]

          sig = 'static HRESULT WINAPI video_processor_VideoProcessBlt(IDirectXVideoProcessor *iface, IDirect3DSurface9 *rt,\n        const DXVA2_VideoProcessBltParams *params, const DXVA2_VideoSample *samples, UINT sample_count,\n        HANDLE *complete_handle)\n{'
          pos = find_or_die(s, sig, label=sig)
          trace = find_or_die(s, '    TRACE(', pos, 'VideoProcessBlt TRACE')
          s = s[:trace] + '''    static unsigned int oppw4_blt_count;
    unsigned int oppw4_blt_idx = ++oppw4_blt_count;
    if (oppw4_blt_idx <= 120)
    {
        D3DSURFACE_DESC oppw4_rt_desc = {0};
        HRESULT oppw4_rt_hr = rt ? IDirect3DSurface9_GetDesc(rt, &oppw4_rt_desc) : E_POINTER;
        ERR("OPPW4TRACE DXVA_BLT #%u processor=%p rt=%p desc_hr=%#lx fmt=%#x size=%ux%u samples=%u target=(%ld,%ld)-(%ld,%ld).\\n",
                oppw4_blt_idx, iface, rt, oppw4_rt_hr, (unsigned int)oppw4_rt_desc.Format,
                oppw4_rt_desc.Width, oppw4_rt_desc.Height, sample_count,
                params->TargetRect.left, params->TargetRect.top, params->TargetRect.right, params->TargetRect.bottom);
    }

''' + s[trace:]

          old = '''        if (FAILED(hr = IDirect3DDevice9_StretchRect(device, samples[i].SrcSurface, &samples[i].SrcRect,
                rt, &dst_rect, D3DTEXF_POINT)))
        {
            WARN("Failed to copy sample %u, hr %#lx.\\n", i, hr);
        }'''
          new = '''        {
            D3DSURFACE_DESC oppw4_src_desc = {0};
            HRESULT oppw4_desc_hr = samples[i].SrcSurface ? IDirect3DSurface9_GetDesc(samples[i].SrcSurface, &oppw4_src_desc) : E_POINTER;
            hr = IDirect3DDevice9_StretchRect(device, samples[i].SrcSurface, &samples[i].SrcRect,
                    rt, &dst_rect, D3DTEXF_POINT);
            if (oppw4_blt_idx <= 120)
                ERR("OPPW4TRACE DXVA_STRETCH #%u i=%u src=%p desc_hr=%#lx fmt=%#x size=%ux%u src_rect=(%ld,%ld)-(%ld,%ld) dst_rect=(%ld,%ld)-(%ld,%ld) hr=%#lx.\\n",
                        oppw4_blt_idx, i, samples[i].SrcSurface, oppw4_desc_hr, (unsigned int)oppw4_src_desc.Format,
                        oppw4_src_desc.Width, oppw4_src_desc.Height,
                        samples[i].SrcRect.left, samples[i].SrcRect.top, samples[i].SrcRect.right, samples[i].SrcRect.bottom,
                        dst_rect.left, dst_rect.top, dst_rect.right, dst_rect.bottom, hr);
            if (FAILED(hr))
                WARN("Failed to copy sample %u, hr %#lx.\\n", i, hr);
        }'''
          if old not in s:
              raise SystemExit('DXVA StretchRect anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          grep -n -m1 'OPPW4TRACE MIXER_INPUT' dlls/evr/mixer.c
          grep -n -m1 'OPPW4TRACE MIXER_RENDER' dlls/evr/mixer.c
          grep -n -m1 'OPPW4TRACE DXVA_BLT' dlls/dxva2/main.c
          grep -n -m1 'OPPW4TRACE DXVA_STRETCH' dlls/dxva2/main.c

      - name: Download Termux ARM64 sysroot
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/termuxfs/aarch64"
          cd "$HOME/termuxfs/aarch64"
          wget -q --show-progress https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Set up Android NDK r27d
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Set up LLVM-MinGW ARM64EC toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          wget -q --show-progress https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen Proton 11
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0-autogen.sh
          test -x ./configure

      - name: Build wine-tools
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step0.sh
          test -d wine-tools

      - name: Configure ARM64EC SDK35 / 16KB
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --configure

      - name: Build and install Proton 11 ARM64EC with strict failure capture
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/proton-src"

          FULL_LOG="$RUNNER_TEMP/opppw4-v8-build-full.log"
          BUILD_DIAG="$GITHUB_WORKSPACE/v8-build-diagnostics.txt"
          : > "$FULL_LOG"
          : > "$BUILD_DIAG"

          echo "phase=build" >> "$BUILD_DIAG"
          if ! bash -e build-scripts/build-step-arm64ec.sh --enable-16kb-pages --build >"$FULL_LOG" 2>&1; then
            {
              echo "RESULT=FAIL build"
              echo "=== last 180 build lines ==="
              tail -n 180 "$FULL_LOG"
            } >> "$BUILD_DIAG"
            cat "$BUILD_DIAG"
            exit 1
          fi
          echo "RESULT=PASS build" >> "$BUILD_DIAG"

          echo "phase=install" >> "$BUILD_DIAG"
          if ! bash -e build-scripts/build-step-arm64ec.sh --enable-16kb-pages --install >>"$FULL_LOG" 2>&1; then
            {
              echo "RESULT=FAIL install"
              echo "=== last 180 build/install lines ==="
              tail -n 180 "$FULL_LOG"
            } >> "$BUILD_DIAG"
            cat "$BUILD_DIAG"
            exit 1
          fi
          echo "RESULT=PASS install" >> "$BUILD_DIAG"
          echo "Build/install completed; full compiler log intentionally kept out of Actions output."

      - name: Verify installed Wine tree
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/termuxfs/aarch64/data/data/com.termux/files/opt/wine"
          PACKAGE_ROOT="$GITHUB_WORKSPACE/package-root"
          DIAG="$GITHUB_WORKSPACE/v8-package-diagnostics.txt"

          : > "$DIAG"
          fail() {
            echo "RESULT=FAIL $*" | tee -a "$DIAG"
            exit 1
          }

          {
            echo "phase=install-tree"
            echo "INSTALL_DIR=$INSTALL_DIR"
            du -sh "$INSTALL_DIR" || true
          } | tee -a "$DIAG"

          [ -d "$INSTALL_DIR/bin" ] || fail "missing $INSTALL_DIR/bin"
          [ -d "$INSTALL_DIR/lib/wine" ] || fail "missing $INSTALL_DIR/lib/wine"
          [ -d "$INSTALL_DIR/share/wine" ] || fail "missing $INSTALL_DIR/share/wine"

          INSTALL_FILES="$(find "$INSTALL_DIR/lib/wine" -type f -print | wc -l)"
          INSTALL_BYTES="$(du -sb "$INSTALL_DIR/lib/wine" | cut -f1)"
          echo "install_files=$INSTALL_FILES" | tee -a "$DIAG"
          echo "install_bytes=$INSTALL_BYTES" | tee -a "$DIAG"
          [ "$INSTALL_FILES" -ge 100 ] || fail "install tree has only $INSTALL_FILES files"
          [ "$INSTALL_BYTES" -ge 50000000 ] || fail "install tree has only $INSTALL_BYTES bytes"
          echo "RESULT=PASS install-tree" | tee -a "$DIAG"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT" "$GITHUB_WORKSPACE/out"
          cp -a "$INSTALL_DIR/bin" "$PACKAGE_ROOT/"
          cp -a "$INSTALL_DIR/lib" "$PACKAGE_ROOT/"
          cp -a "$INSTALL_DIR/share" "$PACKAGE_ROOT/"
          echo "RESULT=PASS package-tree" | tee -a "$DIAG"

      - name: Verify v8 trace markers in packaged runtime
        run: |
          set -euo pipefail
          DIAG="$GITHUB_WORKSPACE/v8-package-diagnostics.txt"
          python3 - <<'PY' 2>&1 | tee -a "$DIAG"
          import os
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']) / 'package-root/lib/wine'
          markers = {
              b'OPPW4TRACE SESSION_ROUTE': None,
              b'OPPW4TRACE MF_EVR_SAMPLE': None,
              b'OPPW4TRACE MIXER_INPUT': None,
              b'OPPW4TRACE MIXER_RENDER': None,
              b'OPPW4TRACE DXVA_BLT': None,
              b'OPPW4TRACE DXVA_STRETCH': None,
          }
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              for marker in markers:
                  if markers[marker] is None and marker in data:
                      markers[marker] = path
              if all(markers.values()):
                  break
          for marker, path in markers.items():
              print(f'{marker.decode()}={path}')
          missing = [m.decode() for m, p in markers.items() if p is None]
          if missing:
              print('RESULT=FAIL missing trace markers: ' + ', '.join(missing))
              raise SystemExit(1)
          print('RESULT=PASS trace-markers')
          PY

      - name: Upload compact v8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-p11-mixer-dxva-trace-v8-diagnostics
          path: |
            v8-build-diagnostics.txt
            v8-package-diagnostics.txt
            p11-source-commit.txt
            apply-v7-instrumentation.py
          if-no-files-found: warn
          retention-days: 14

      - name: Download Proton 11 ARM64EC prefix pack
        run: |
          set -euxo pipefail
          wget -q --show-progress \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O "$GITHUB_WORKSPACE/prefixPack.txz"

      - name: Package verified Bannerlator v8 mixer DXVA WCP
        run: |
          set -euxo pipefail
          PACKAGE_ROOT="$GITHUB_WORKSPACE/package-root"
          WCP="$GITHUB_WORKSPACE/out/proton-11.0.3.10-arm64ec-opppw4-mixer-dxva-trace-v8-sdk35.wcp"

